version: '3.8'

services:
  # -----------------------------------------------------------------
  # 1. Relational Database: MySQL 8.0
  # -----------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: credential_portal_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: credential_portal
      MYSQL_USER: portal_user
      MYSQL_PASSWORD: portal_password123
    ports:
      - "3306:3306"
    volumes:
      - portal_mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal_network

  # -----------------------------------------------------------------
  # 2. Application Backend: Python FastAPI
  # -----------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: credential_portal_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=credential_portal
      - MYSQL_USER=portal_user
      - MYSQL_PASSWORD=portal_password123
      - DATABASE_URL=mysql+pymysql://portal_user:portal_password123@mysql:3306/credential_portal?charset=utf8mb4
      - SECRET_KEY=credential-portal-super-secret-production-key-2026-98124
      - FRONTEND_URL=http://localhost:5173
    ports:
      - "8000:8000"
    networks:
      - portal_network

  # -----------------------------------------------------------------
  # 3. Application Frontend: React + Vite + Nginx
  # -----------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: credential_portal_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
      - "80:80"
    networks:
      - portal_network

networks:
  portal_network:
    driver: bridge

volumes:
  portal_mysql_data:
    driver: local

