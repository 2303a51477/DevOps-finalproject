apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: credential-portal
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: credential-portal
      tier: frontend
  template:
    metadata:
      labels:
        app: credential-portal
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: credential-portal-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
